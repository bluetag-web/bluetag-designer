# 自动发布: 推送 v* 标签时, 跑测试 → 构建 → 创建 GitHub Release 并附上 dist 产物 zip
# 用法: git tag v1.0.0 && git push origin v1.0.0
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Package dist
        run: |
          cd dist
          zip -r ../bluetag-designer-${{ github.ref_name }}.zip .
          cd ..
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: bluetag-designer-${{ github.ref_name }}.zip